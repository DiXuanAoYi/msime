[package]
name = "zhiyu-companion"
version = "0.1.0"
edition = "2021"
description = "知语桌面伴侣：平时像桌面宠物，输入或语音识别时跳到候选窗上、手放在耳朵上。"
publish = false

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 2
lto = "thin"
