[package]
name = "msime-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "水杉输入法引擎的 Rust 核心：从词库查询开始，逐块替换 C++ 实现，每块都对着 engine/contracts/golden 的黄金样本核对。"
publish = false

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

[dev-dependencies]
serde_json = "1"
