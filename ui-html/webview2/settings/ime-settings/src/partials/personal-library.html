<div class="content" id="personalLibraryPanel">
  <div class="clipboard-heading"><div><h2>剪贴板</h2><p>复制记录和常用语。选中查看，复制后手动粘贴。</p></div><button id="libraryRefresh" type="button">刷新</button></div>
  <nav class="clipboard-tabs" aria-label="剪贴板与资料类型">
    <button type="button" data-library-view="history" aria-pressed="true">最近复制</button>
    <button type="button" data-library-view="clips" aria-pressed="false">常用语</button>
    <button type="button" data-library-view="favorites" aria-pressed="false">语音收藏</button>
    <button type="button" data-library-view="rules" aria-pressed="false">软件词库</button>
    <button type="button" data-library-view="learning" aria-pressed="false">学习记录</button>
    <button type="button" data-library-view="study" aria-pressed="false">生词复习</button>
  </nav>
  <select id="libraryView" hidden aria-hidden="true"><option value="history">最近复制</option><option value="clips">常用语</option><option value="favorites">语音收藏</option><option value="rules">软件词库</option><option value="learning">学习记录</option><option value="study">生词复习</option></select>
  <div class="clipboard-toolbar"><label class="clipboard-capture"><input type="checkbox" id="libraryCaptureEnabled">记录复制的文字</label><button id="libraryNew" type="button" hidden>新建常用语</button><button id="libraryClearHistory" type="button">清空复制记录</button></div>
  <p id="libraryStatus" role="status" aria-live="polite"></p>
  <div id="libraryApplicationManager" class="prompt-library" hidden>
    <p>启用软件独立学习后，新造词、英文回车学习与候选使用次数仅保存在此软件；原有全局词典继续作为基础词库。关闭独立学习可恢复原有共享行为，已经记录的内容仍保留。</p>
    <label>已配置的软件<select id="libraryApplicationSelect"><option value="">选择或填写新软件</option></select></label>
    <label>软件文件名<input id="libraryScope" placeholder="例如 WeChat.exe、Code.exe" maxlength="260" /></label>
    <div class="local-asr-actions library-flags">
      <label><input id="libraryIsolation" type="checkbox" checked /> 独立词库与学习</label>
      <label><input id="libraryAutoLearn" type="checkbox" checked /> 自动学习新词</label>
      <label><input id="libraryFrequency" type="checkbox" checked /> 按本软件使用次数排序</label>
    </div>
    <div class="local-asr-actions"><button id="librarySaveApplication" type="button">保存软件开关</button><button id="libraryExportApplication" type="button">导出此软件词库</button><button id="libraryImportApplication" type="button">导入并合并到此软件</button><input id="libraryImportFile" type="file" accept="application/json,.json" hidden /></div>
    <p>导入会合并并去重，不覆盖已有词条、软件开关和全局用户词典。学习记录可逐条删除；建议先导出备份。</p>
  </div>
  <div id="libraryGroups" class="prompt-library">
    <label>分组<select id="libraryGroup"></select></label>
    <details class="workbench-details"><summary>管理分组 · 添加、重命名和转移</summary>
    <label>分组名称<input
        id="libraryGroupName"
        placeholder="填写分组名后添加，或给当前分组重命名"
    /></label>
    <div class="local-asr-actions">
      <button id="libraryAddGroup" type="button">添加分组</button
      ><button id="libraryRenameGroup" type="button">重命名当前分组</button
      ><button id="libraryRemoveGroup" type="button">删除分组并转移内容</button>
    </div></details>
  </div>
  <details id="libraryEditor" class="prompt-library"><summary>编辑内容</summary>
    <label>标题<input id="libraryName" maxlength="80" /></label>
    <div id="libraryAppFields">
      <label
        >应用程序文件名<input
          id="libraryApplication"
          placeholder="例如 WeChat.exe、Code.exe；仅作用于此程序" /></label
      ><label
        >触发编码<input
          id="libraryCode"
          maxlength="80"
          placeholder="小写字母编码；只在完整匹配时出现" /></label
      ><label
        ><input id="libraryEnabled" type="checkbox" checked /> 启用此词条</label
      >
    </div>
    <label
      >文字内容<textarea id="libraryText" rows="4" maxlength="5000"></textarea>
    </label>
    <div class="local-asr-actions">
      <button id="librarySave" type="button">保存到本机</button>
    </div>
  </details>
  <div id="libraryStudy" hidden>
    <p>
      依据已记录的学习生词安排间隔复习：忘记 10 分钟后再看，模糊 1
      天后再看，记住则逐步延长。不会改写原来的熟悉度统计。
    </p>
    <button id="libraryLoadStudy" type="button">载入到期复习</button>
    <h3 id="libraryStudyWord"></h3>
    <p id="libraryStudyAnswer" hidden></p>
    <div class="local-asr-actions">
      <button id="libraryReveal" type="button">查看释义</button
      ><button data-review="0" type="button">忘记</button
      ><button data-review="1" type="button">模糊</button
      ><button data-review="2" type="button">记住</button>
    </div>
    <p id="libraryStudyCount"></p>
  </div>
  <div id="librarySearchArea" class="library-search-row"><input id="librarySearch" type="search" maxlength="160" placeholder="搜索标题、文字、软件或编码" aria-label="搜索当前资料" /><span id="libraryResultCount" class="voice-description"></span></div>
  <div id="libraryBrowse" class="clipboard-browser">
    <div id="libraryRows" class="clipboard-list" role="listbox" aria-label="当前内容列表"></div>
    <aside id="libraryPreview" class="clipboard-preview" aria-label="选中内容预览">
      <h3 id="libraryPreviewTitle">选择一条记录</h3><p id="libraryPreviewMeta"></p>
      <textarea id="libraryPreviewText" readonly rows="8" aria-label="完整内容预览"></textarea>
      <div id="libraryPreviewActions" class="clipboard-actions"></div>
    </aside>
  </div>
  <div id="libraryPager" class="library-pager"><button id="libraryPrevious" type="button">上一页</button><span id="libraryPage"></span><button id="libraryNext" type="button">下一页</button></div>
</div>
